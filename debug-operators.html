<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Debug Operators</title>
<style>body{font-family:monospace;padding:20px;background:#f0f2f5;}
h2{color:#003D52;}h3{color:#7c3aed;margin-top:24px;}pre{background:white;border:1px solid #ccc;padding:15px;border-radius:8px;white-space:pre-wrap;word-break:break-all;font-size:13px;}
.match{background:#d1fae5;} .nomatch{background:#fee2e2;}</style>
</head>
<body>
<h2>Debug — localStorage de producción</h2>

<h3>1. customOperators_v5 (operadores guardados)</h3>
<pre id="out-ops"></pre>

<h3>2. Nombres de equipo en csoChecklist_v5</h3>
<pre id="out-equip"></pre>

<h3>3. Coincidencias clave operadores ↔ nombre en checklist</h3>
<pre id="out-match"></pre>

<script>
// --- Operators ---
const ops = JSON.parse(localStorage.getItem('customOperators_v5') || '{}');
const opsKeys = Object.keys(ops);
if (opsKeys.length === 0) {
    document.getElementById('out-ops').textContent = '(vacío)';
} else {
    let txt = '';
    opsKeys.forEach(k => { txt += `"${k}":\n  → ${JSON.stringify(ops[k])}\n\n`; });
    document.getElementById('out-ops').textContent = txt;
}

// --- Equipment names in checklist ---
const raw = localStorage.getItem('csoChecklist_v5');
let equipNames = [];
if (raw) {
    try {
        const data = JSON.parse(raw);
        if (data.equipment) {
            const eq = JSON.parse(data.equipment);
            equipNames = eq.map(e => e.name);
            document.getElementById('out-equip').textContent = eq.map(e => `"${e.name}"`).join('\n') || '(ninguno)';
        } else {
            document.getElementById('out-equip').textContent = '(sin campo equipment en checklist)';
        }
    } catch(e) { document.getElementById('out-equip').textContent = 'Error: ' + e.message; }
} else {
    document.getElementById('out-equip').textContent = '(csoChecklist_v5 vacío)';
}

// --- Match check ---
let matchTxt = '';
equipNames.forEach(name => {
    const found = ops[name];
    matchTxt += `"${name}"\n  → ops[key] = ${found ? JSON.stringify(found) : '❌ NO ENCONTRADO'}\n\n`;
});
document.getElementById('out-match').textContent = matchTxt || '(sin equipos en checklist)';
</script>
</body>
</html>
